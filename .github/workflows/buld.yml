name: Build ccminer with MSVC

on:
  push:
    branches: [ Verus2.2, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Устанавливаем MSBuild / Visual Studio 2022
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1
        with:
          vs-version: '17.0'

      # 3. Обновляем Windows SDK с 8.1 на 10.0.22621.0
      - name: Update Windows SDK version in project
        run: |
               powershell -Command "
               [xml]$xml = Get-Content 'ccminer.vcxproj'
               $ns = @{msb='http://schemas.microsoft.com/developer/msbuild/2003'}
               $xml.SelectNodes('//msb:WindowsTargetPlatformVersion', $ns) | ForEach-Object { $_.'#text' = '10.0.22621.0' }
               $xml.Save('ccminer.vcxproj')
               "


      # 4. Собираем проект
      - name: Build ccminer.sln
        run: msbuild ccminer.sln /p:Configuration=Release /p:Platform=x64 /m

      # 5. Загружаем артефакты сборки
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ccminer-build
          path: |
            Release\*

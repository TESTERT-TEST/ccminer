name: Build ccminer Windows

on:
  push:
    branches: [ Verus2.2, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install all dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc-mingw-w64 \
          g++-mingw-w64 \
          libtool \
          automake \
          autoconf \
          pkg-config \
          libcurl4-openssl-dev \
          libssl-dev \
          libjansson-dev \
          zlib1g-dev

    - name: Build ccminer
      run: |
        ./autogen.sh
        ./configure --host=x86_64-w64-mingw32
        make -j$(nproc)

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ccminer-windows
        path: ccminer.exe
        retention-days: 7

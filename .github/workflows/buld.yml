name: Build ccminer Windows

on:
  push:
    branches: [ Verus2.2, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [x64, x86]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc-mingw-w64-x86-64 \
          g++-mingw-w64-x86-64 \
          gcc-mingw-w64-i686 \
          g++-mingw-w64-i686 \
          libtool \
          automake \
          autoconf \
          pkg-config \
          libcurl4-openssl-dev \
          libssl-dev \
          libjansson-dev \
          zlib1g-dev

    - name: Install Windows SSL libraries
      run: |
        # Установка mingw с SSL поддержкой
        sudo apt-get install -y \
          mingw-w64 \
          libcurl4-openssl-dev

    - name: Build ccminer with static linking
      run: |
        ./autogen.sh
        
        if [ "${{ matrix.architecture }}" = "x64" ]; then
          ./configure --host=x86_64-w64-mingw32 --without-cuda \
            --enable-static --disable-shared \
            CFLAGS="-static -O2" \
            CXXFLAGS="-static -O2" \
            LDFLAGS="-static -lcurl -lssl -lcrypto -lz -lpthread -lws2_32"
        else
          ./configure --host=i686-w64-mingw32 --without-cuda \
            --enable-static --disable-shared \
            CFLAGS="-static -O2" \
            CXXFLAGS="-static -O2" \
            LDFLAGS="-static -lcurl -lssl -lcrypto -lz -lpthread -lws2_32"
        fi
        
        make -j$(nproc)

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ccminer-${{ matrix.architecture }}
        path: ccminer.exe
        retention-days: 7

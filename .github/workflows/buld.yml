name: Build ccminer Windows x64

on:
  push:
    branches: [ Verus2.2, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          mingw-w64 \
          g++-mingw-w64-x86-64 \
          gcc-mingw-w64-x86-64 \
          libcurl4-openssl-dev \
          libssl-dev \
          libjansson-dev \
          zlib1g-dev

    - name: Set MinGW to POSIX
      run: |
        sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
        sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

    - name: Compile ccminer manually
      run: |
        # Список всех исходников ccminer
        SRC_FILES=$(find . -name "*.cpp")
        
        # Компиляция вручную через MinGW
        x86_64-w64-mingw32-g++ -O2 -std=c++11 $SRC_FILES \
          -I/usr/x86_64-w64-mingw32/include \
          -L/usr/x86_64-w64-mingw32/lib \
          -lws2_32 -lwinmm -lssl -lcrypto -lcurl -ljansson -lz \
          -o ccminer.exe

        ls -lh ccminer.exe

    - name: Upload Windows binary
      uses: actions/upload-artifact@v4
      with:
        name: ccminer-windows-x64
        path: ccminer.exe
        retention-days: 7

name: Build ccminer Windows x64

on:
  push:
    branches: [ Verus2.2, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc-mingw-w64-x86-64 \
          g++-mingw-w64-x86-64 \
          libtool \
          automake \
          autoconf \
          pkg-config \
          libcurl4-openssl-dev \
          libssl-dev \
          libjansson-dev \
          zlib1g-dev \
          mingw-w64

    - name: Install Windows SSL development libraries
      run: |
        # Установка Windows версий библиотек
        sudo apt-get install -y \
          libcurl4-openssl-dev \
          libjansson-dev \
          libssl-dev

    - name: Build ccminer with Windows libraries
      run: |
        ./autogen.sh
        
        # Компиляция с явным указанием путей к библиотекам
        ./configure --host=x86_64-w64-mingw32 \
          CPPFLAGS="-I/usr/x86_64-w64-mingw32/include" \
          LDFLAGS="-L/usr/x86_64-w64-mingw32/lib -lcurl -lssl -lcrypto -ljansson -lz -lpthread"
        
        make -j$(nproc)

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ccminer-windows-x64
        path: ccminer.exe
        retention-days: 7

name: Build ccminer Windows x64

on:
  push:
    branches: [ Verus2.2, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          autoconf \
          automake \
          libtool \
          pkg-config \
          mingw-w64 \
          g++-mingw-w64-x86-64 \
          gcc-mingw-w64-x86-64 \
          libcurl4-openssl-dev \
          libssl-dev \
          libjansson-dev \
          zlib1g-dev

    - name: Set MinGW to POSIX
      run: |
        sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
        sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
        x86_64-w64-mingw32-gcc -v

    - name: Test compiler
      run: |
        echo "int main() { return 0; }" > test.c
        x86_64-w64-mingw32-gcc test.c -o test.exe
        file test.exe

    - name: Prepare configure
      run: |
        # Обновляем autoconf/automake для патченного configure.ac
        autoreconf -fiv

    - name: Run autogen and configure
      run: |
        ./autogen.sh || true
        CC=x86_64-w64-mingw32-gcc \
        CXX=x86_64-w64-mingw32-g++ \
        ./configure --host=x86_64-w64-mingw32 \
          CPPFLAGS="-I/usr/x86_64-w64-mingw32/include" \
          LDFLAGS="-L/usr/x86_64-w64-mingw32/lib" \
          LIBS="-lws2_32 -lwinmm -lssl -lcrypto -lcurl -ljansson -lz"

    - name: Build ccminer
      run: |
        make -j$(nproc)
        ls -lh ccminer.exe || echo "ccminer.exe not found!"

    - name: Upload Windows binary
      uses: actions/upload-artifact@v4
      with:
        name: ccminer-windows-x64
        path: ccminer.exe
        retention-days: 7

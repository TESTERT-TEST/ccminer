name: Build ccminer Windows x64

on:
  push:
    branches: [ Verus2.2, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc-mingw-w64-x86-64 \
          g++-mingw-w64-x86-64 \
          libtool \
          automake \
          autoconf \
          pkg-config \
          libcurl4-openssl-dev \
          libssl-dev \
          libjansson-dev

    - name: Setup pkg-config for Windows
      run: |
        # Настройка pkg-config для поиска Windows библиотек
        export PKG_CONFIG_PATH=/usr/x86_64-w64-mingw32/lib/pkgconfig
        export PKG_CONFIG_LIBDIR=/usr/x86_64-w64-mingw32/lib

    - name: Build ccminer
      run: |
        ./autogen.sh
        ./configure --host=x86_64-w64-mingw32
        make -j$(nproc)

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ccminer-windows-x64
        path: ccminer.exe
        retention-days: 7

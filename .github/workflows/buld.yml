name: Build ccminer with VS2015

on:
  push:
    branches: [ Verus2.2, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Клонируем репозиторий
      - uses: actions/checkout@v3

      # 2. Устанавливаем VS2015 Build Tools через Chocolatey
      - name: Install VS2015 Build Tools
        run: choco install visualstudio2015buildtools -y

      # 3. Инициализация переменных среды для MSBuild 2015
      - name: Setup VS2015 environment
        run: '"C:\Program Files (x86)\Microsoft Visual Studio 14.0\VC\vcvarsall.bat" amd64'

      # 4. Обновляем Windows SDK (если нужно)
      - name: Update Windows SDK version in project
        shell: pwsh
        run: |
          [xml]$xml = Get-Content -Path 'ccminer.vcxproj' -Raw
          $xml.Project.PropertyGroup.WindowsTargetPlatformVersion = '10.0.22621.0'
          $xml.Save('ccminer.vcxproj')

      # 5. Собираем проект через MSBuild 2015
      - name: Build ccminer.sln
        run: '"C:\Program Files (x86)\MSBuild\14.0\Bin\MSBuild.exe" ccminer.sln /p:Configuration=Release /p:Platform=x64 /m'

      # 6. Загружаем артефакты сборки
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ccminer-build
          path: Release\*

name: Build ccminer Windows x64

on:
  push:
    branches: [ Verus2.2, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          autoconf \
          automake \
          libtool \
          pkg-config \
          mingw-w64 \
          g++-mingw-w64-x86-64 \
          gcc-mingw-w64-x86-64 \
          libcurl4-openssl-dev \
          libssl-dev \
          libjansson-dev \
          zlib1g-dev

    - name: Prepare environment
      run: |
        export CC=x86_64-w64-mingw32-gcc
        export CXX=x86_64-w64-mingw32-g++
        export AR=x86_64-w64-mingw32-ar
        export RANLIB=x86_64-w64-mingw32-ranlib
        echo "CC=$CC"
        echo "CXX=$CXX"

    - name: Run autogen and configure
      run: |
        ./autogen.sh
        ./configure --host=x86_64-w64-mingw32 \
          --disable-shared \
          --enable-static \
          CPPFLAGS="-I/usr/x86_64-w64-mingw32/include" \
          LDFLAGS="-L/usr/x86_64-w64-mingw32/lib" \
          LIBS="-lws2_32 -lwinmm -lssl -lcrypto -lcurl -ljansson -lz"

    - name: Build ccminer
      run: |
        make -j$(nproc)
        ls -lh ccminer.exe || echo "ccminer.exe not found!"

    - name: Upload Windows binary
      uses: actions/upload-artifact@v4
      with:
        name: ccminer-windows-x64
        path: ccminer.exe
        retention-days: 7

name: Build ccminer Windows x64 Static

on:
  push:
    branches: [ Verus2.2, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc-mingw-w64-x86-64 \
          g++-mingw-w64-x86-64 \
          libtool \
          automake \
          autoconf \
          pkg-config \
          libcurl4-openssl-dev \
          libssl-dev \
          libjansson-dev \
          zlib1g-dev

    - name: Build ccminer with static linking
      run: |
        ./autogen.sh
        
        # Статическая компиляция
        ./configure --host=x86_64-w64-mingw32 \
          CFLAGS="-static -O2" \
          CXXFLAGS="-static -O2" \
          LDFLAGS="-static -lcurl -lssl -lcrypto -ljansson -lz -lpthread -lws2_32"
        
        make -j$(nproc)

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ccminer-windows-x64-static
        path: ccminer.exe
        retention-days: 7

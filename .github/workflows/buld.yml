name: Build ccminer with MSVC (v140)

on:
  push:
    branches: [ Verus2.2, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Устанавливаем MSBuild / Visual Studio 2022
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1
        with:
          vs-version: '17.0'

      # 4. Собираем проект с v140 toolset
      - name: Build ccminer.sln
        run: msbuild ccminer.sln /p:Configuration=Release /p:Platform=x64 /m

      # 5. Загружаем артефакты сборки
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ccminer-build
          path: |
            Release\*
